name: Publicar LIDUTEC+ no GitHub Pages

on:
  push:
    branches:
      - desenvolvimento
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar site estático
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets pages _site/
          touch _site/.nojekyll
          # index.html redireciona com caminho absoluto ("/pages/login.html"),
          # correto para o Cloudflare Pages (serve na raiz do dominio). O
          # GitHub Pages serve num subcaminho (/LIDUTEC-PLUS/), entao aqui
          # (so nesta copia, nunca no index.html do repositorio) reescreve
          # o alvo do redirecionamento para incluir o subcaminho do projeto.
          sed -i 's#"/pages/login.html"#"/LIDUTEC-PLUS/pages/login.html"#' _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
