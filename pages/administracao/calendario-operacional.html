<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendário operacional | Metalsider</title><link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg"><link rel="manifest" href="../../manifest.webmanifest"><meta name="theme-color" content="#1f45a8"><link rel="stylesheet" href="../../assets/css/app.css"><link rel="stylesheet" href="../../assets/css/dashboard.css"><link rel="stylesheet" href="../../assets/css/checklists.css"><link rel="stylesheet" href="../../assets/css/calendario-operacional.css"></head><body class="app-page"><aside class="sidebar" id="sidebar"><div class="sidebar-brand"><div class="sidebar-logo">L+</div><div><strong>Metalsider</strong><span>Gestão Industrial</span></div></div><nav class="sidebar-nav"></nav><button id="logout-button" class="logout-button">Sair</button></aside><div class="app-shell"><header class="topbar"><button id="menu-button" class="menu-button">☰</button><div class="topbar-title"><h1>Calendário operacional</h1><p>Feriados, férias coletivas, folgas e trabalho excepcional</p></div><div class="user-box"><div><strong id="user-name">Carregando...</strong><span id="user-profile">Usuário</span></div><div id="user-avatar" class="user-avatar">U</div></div></header><main class="main-content"><div id="calendar-admin-message" class="form-message" hidden></div><section class="panel calendar-admin-form-panel"><div class="panel-header"><div><span class="eyebrow">Administração</span><h2 id="calendar-form-title">Novo período</h2></div></div><form id="calendar-admin-form"><input name="id" type="hidden"><div class="calendar-admin-grid"><label class="calendar-name">Nome<input name="nome" maxlength="160" required placeholder="Ex.: Férias coletivas de fim de ano"></label><label>Tipo<select name="tipo" required><option value="FERIADO">Feriado</option><option value="FERIAS_COLETIVAS">Férias coletivas</option><option value="FOLGA_PROGRAMADA">Folga programada</option><option value="TRABALHO_EXCEPCIONAL">Trabalho excepcional</option></select></label><label>Escopo<select name="escopo" required><option value="EMPRESA">Empresa</option><option value="FEDERAL">Federal</option><option value="ESTADUAL">Estadual</option><option value="MUNICIPAL">Municipal — Betim/MG</option></select></label><label>Início<input name="data_inicio" type="date" required></label><label>Fim<input name="data_fim" type="date" required></label><label>Turno<select name="turno" required><option value="TODOS">Todos</option><option value="MANHA">Manhã</option><option value="TARDE">Tarde</option><option value="NOITE">Noite</option></select></label><label class="calendar-notes">Observações<input name="observacao" maxlength="500"></label><label class="calendar-active"><input name="ativo" type="checkbox" checked> Ativo</label></div><div class="form-actions"><button id="calendar-cancel" type="button" class="button button-secondary" hidden>Cancelar edição</button><button class="button button-primary" type="submit">Salvar período</button></div></form></section><section class="panel"><div class="calendar-admin-toolbar"><label>Ano<input id="calendar-year-filter" type="number" min="2020" max="2100"></label><label>Tipo<select id="calendar-type-filter"><option value="">Todos</option><option value="FERIADO">Feriados</option><option value="FERIAS_COLETIVAS">Férias coletivas</option><option value="FOLGA_PROGRAMADA">Folgas programadas</option><option value="TRABALHO_EXCEPCIONAL">Trabalho excepcional</option></select></label></div><div class="table-wrapper"><table class="products-table calendar-admin-table"><thead><tr><th>Período</th><th>Nome</th><th>Tipo</th><th>Escopo</th><th>Turno</th><th>Status</th><th>Observações</th><th>Ações</th></tr></thead><tbody id="calendar-admin-rows"></tbody></table></div><div id="calendar-admin-empty" class="empty-panel" hidden><strong>Nenhum período encontrado</strong></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/js/config.js"></script><script src="../../assets/js/supabase.js"></script><script src="../../assets/js/app.js"></script><script src="../../assets/js/calendario-operacional.js"></script></body></html>
