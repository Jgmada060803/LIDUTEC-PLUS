<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Criar acesso | LIDUTEC+</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body class="login-page" data-auth-page="signup">
  <main class="login-container">
    <section class="login-brand">
      <div class="brand-badge">L+</div>
      <h1>LIDUTEC+</h1>
      <p>Solicite seu acesso usando exclusivamente o e-mail corporativo Metalsider.</p>
    </section>
    <section class="login-card">
      <div class="login-header">
        <h2>Criar acesso</h2>
        <p>Após confirmar o e-mail, um administrador definirá suas telas e funções.</p>
      </div>
      <form id="account-form" class="auth-form">
        <div class="form-group"><label for="name">Nome completo</label><input id="name" name="nome" autocomplete="name" maxlength="160" required></div>
        <div class="form-group"><label for="email">E-mail corporativo</label><input id="email" name="email" type="email" placeholder="nome@metalsider.com.br" autocomplete="email" required></div>
        <div class="form-group"><label for="password">Senha</label><input id="password" name="senha" type="password" minlength="8" autocomplete="new-password" required></div>
        <div class="form-group"><label for="password-confirmation">Confirmar senha</label><input id="password-confirmation" name="confirmacao" type="password" minlength="8" autocomplete="new-password" required></div>
        <div id="account-message" class="form-message" hidden></div>
        <button class="button button-primary button-full">Solicitar acesso</button>
      </form>
      <nav class="auth-links"><a href="./login.html">Voltar ao login</a></nav>
      <div class="login-footer"><span>Somente @metalsider.com.br</span></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth-contas.js"></script>
</body>
</html>
