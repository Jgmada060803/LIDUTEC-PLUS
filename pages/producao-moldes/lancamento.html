<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lançar Produção | LIDUTEC+</title><link rel="stylesheet" href="../../assets/css/app.css"><link rel="stylesheet" href="../../assets/css/dashboard.css"><link rel="stylesheet" href="../../assets/css/producao-moldes.css"></head>
<body class="app-page" data-production-page="entry"><aside class="sidebar" id="sidebar"><div class="sidebar-brand"><div class="sidebar-logo">L+</div><div><strong>LIDUTEC+</strong><span>Gestão Industrial</span></div></div><nav class="sidebar-nav"></nav><button id="logout-button" class="logout-button">Sair</button></aside><div class="app-shell"><header class="topbar"><button id="menu-button" class="menu-button">☰</button><div class="topbar-title"><h1>Lançar Produção</h1><p>Apontamento por produto e turno</p></div><div class="user-box"><div><strong id="user-name">Carregando...</strong><span id="user-profile">Usuário</span></div><div id="user-avatar" class="user-avatar">U</div></div></header><main class="main-content"><div id="production-loading" class="loading-state">Carregando...</div><form id="production-form" class="panel production-form" data-permission="producao_moldes.lancar"><label>Data operacional<input name="data_operacional" type="date" required></label><label>Turno<select name="turno" required><option value="MANHA">Manhã</option><option value="TARDE">Tarde</option><option value="NOITE">Noite</option></select></label><label>Produto<select name="produto_id" data-products required><option value="">Selecione</option></select></label><label>Linha/máquina<select name="linha_maquina_id" data-lines><option value="">Não informada</option></select></label><label>Planejada<input name="quantidade_planejada" type="number" min="0" value="0" required></label><label>Produzida<input name="quantidade_produzida" type="number" min="0" value="0" required></label><label>Aprovada<input name="quantidade_aprovada" type="number" min="0" value="0" required></label><label>Refugada<input name="quantidade_refugada" type="number" min="0" value="0" required></label><label class="full">Observação<textarea name="observacao" rows="3"></textarea></label><div id="production-message" class="form-message" hidden></div><div class="production-form-actions"><a href="./index.html" class="button button-secondary">Voltar</a><button class="button button-primary">Registrar produção</button></div></form></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/js/config.js"></script><script src="../../assets/js/supabase.js"></script><script src="../../assets/js/app.js"></script><script src="../../assets/js/turnos.js"></script><script src="../../assets/js/producao-moldes.js"></script></body></html>
