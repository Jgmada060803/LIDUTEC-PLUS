<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preencher Checklist | Metalsider</title><link rel="stylesheet" href="../../assets/css/app.css"><link rel="stylesheet" href="../../assets/css/dashboard.css"><link rel="stylesheet" href="../../assets/css/controle-processo.css"><link rel="stylesheet" href="../../assets/css/checklists.css"></head>
<body class="app-page" data-checklist-page="form"><aside class="sidebar" id="sidebar"><div class="sidebar-brand"><div class="sidebar-logo">L+</div><div><strong>Metalsider</strong><span>Gestão Industrial</span></div></div><nav class="sidebar-nav"></nav><button id="logout-button" class="logout-button">Sair</button></aside><div class="app-shell"><header class="topbar"><button id="menu-button" class="menu-button">☰</button><div class="topbar-title"><h1 id="form-title">Checklist Operacional</h1><p id="form-subtitle">Carregando modelo...</p></div><div class="user-box"><div><strong id="user-name">Carregando...</strong><span id="user-profile">Usuário</span></div><div id="user-avatar" class="user-avatar">U</div></div></header>
<main class="main-content"><div id="checklist-loading" class="loading-state">Carregando checklist...</div><form id="checklist-form" hidden><section class="checklist-toolbar"><div><span id="form-code" class="eyebrow"></span><h2 id="form-name"></h2><p id="form-instruction"></p></div><a href="./checklists.html" class="button button-secondary">Voltar</a></section>
<section class="panel checklist-context"><div class="checklist-context-grid"><label>Data operacional<input id="execution-date" type="date" required></label><label>Turno<select id="execution-shift" required><option value="MANHA">Manhã</option><option value="TARDE">Tarde</option><option value="NOITE">Noite</option></select></label><label id="product-field">Produto<select id="execution-product"><option value="">Selecione</option></select></label><label id="equipment-field">Equipamento<input id="execution-equipment" type="text" maxlength="100" placeholder="Ex.: DISA, OCU 55, Jato 1"></label><label id="run-field">Corrida<input id="execution-run" type="text" maxlength="80"></label></div></section>
<div id="checklist-sections"></div><section class="panel checklist-general-notes"><label>Observações gerais<textarea id="execution-notes" rows="3" maxlength="1000"></textarea></label></section><div id="checklist-message" class="form-message" hidden></div><div class="checklist-submit-bar"><span id="answer-progress">0 de 0 itens respondidos</span><button id="submit-checklist" class="button button-primary" type="submit">Concluir checklist</button></div></form></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/js/config.js"></script><script src="../../assets/js/supabase.js"></script><script src="../../assets/js/app.js"></script><script src="../../assets/js/turnos.js"></script><script src="../../assets/js/checklists-data.js"></script><script src="../../assets/js/checklists.js"></script></body></html>
