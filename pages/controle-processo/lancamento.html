<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Novo Controle de Processo | LIDUTEC+</title>

  <link rel="stylesheet" href="../../assets/css/app.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/controle-processo.css">
</head>

<body class="app-page">

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">
      <div class="sidebar-logo">L+</div>

      <div>
        <strong>LIDUTEC+</strong>
        <span>Gestão Industrial</span>
      </div>
    </div>

    <nav class="sidebar-nav">

      <a href="../dashboard.html" class="nav-link">
        Dashboard
      </a>

      <div class="nav-section">
        <span class="nav-title">Produção</span>

        <a
          href="./lista.html"
          class="nav-link active"
          data-permission="controle_processo.visualizar"
        >
          Controle de Processo
        </a>
      </div>

    </nav>

    <button id="logout-button" class="logout-button">
      Sair
    </button>

  </aside>

  <div class="app-shell">

    <header class="topbar">

      <button
        type="button"
        class="menu-button"
        id="menu-button"
        aria-label="Abrir ou fechar menu"
      >
        ☰
      </button>

      <div class="topbar-title">
        <h1>Novo Controle de Processo</h1>
        <p id="plan-header-description">
          Carregando plano...
        </p>
      </div>

      <div class="user-box">
        <div>
          <strong id="user-name">Carregando...</strong>
          <span id="user-profile">Usuário</span>
        </div>

        <div class="user-avatar" id="user-avatar">
          U
        </div>
      </div>

    </header>

    <main class="main-content">

      <section class="page-heading">

        <div>
          <span class="eyebrow">Novo lançamento</span>
          <h2 id="plan-name">Controle de Processo</h2>

          <p>
            Informe os dados da coleta e os resultados medidos.
          </p>
        </div>

        <a
          href="./lista.html"
          class="button button-secondary"
        >
          Voltar
        </a>

      </section>

      <form id="control-form" novalidate>

        <section class="panel form-section">

          <div class="panel-header">
            <span class="eyebrow">Identificação</span>
            <h3>Dados do registro</h3>
          </div>

          <div class="form-grid">

            <div class="form-group" id="product-group">
              <label for="produto">
                Produto
              </label>

              <select id="produto" name="produto">
                <option value="">Selecione</option>
              </select>
            </div>

            <div class="form-group" id="machine-group">
              <label for="maquina">
                Máquina
              </label>

              <select id="maquina" name="maquina">
                <option value="">Selecione</option>
              </select>
            </div>

            <div class="form-group" id="ladle-group">
              <label for="panela">
                Panela
              </label>

              <select id="panela" name="panela">
                <option value="">Selecione</option>
              </select>
            </div>

            <div class="form-group">
              <label for="corrida">Corrida</label>
              <input type="text" id="corrida" name="corrida">
            </div>

            <div class="form-group">
              <label for="lote">Lote</label>
              <input type="text" id="lote" name="lote">
            </div>

            <div class="form-group">
              <label for="ordem-producao">
                Ordem de produção
              </label>

              <input
                type="text"
                id="ordem-producao"
                name="ordem-producao"
              >
            </div>

            <div class="form-group">
              <label for="turno">Turno</label>

              <select id="turno" name="turno">
                <option value="">Selecione</option>
                <option value="1">1º turno</option>
                <option value="2">2º turno</option>
                <option value="3">3º turno</option>
                <option value="A">Turno A</option>
                <option value="B">Turno B</option>
                <option value="C">Turno C</option>
              </select>
            </div>

            <div class="form-group form-group-full">
              <label for="observacao">
                Observações gerais
              </label>

              <textarea
                id="observacao"
                name="observacao"
                rows="3"
              ></textarea>
            </div>

          </div>

        </section>

        <div id="parameters-container"></div>

        <div
          id="form-message"
          class="form-message"
          hidden
        ></div>

        <div class="form-actions">

          <a
            href="./lista.html"
            class="button button-secondary"
          >
            Cancelar
          </a>

          <button
            type="submit"
            id="save-button"
            class="button button-primary"
          >
            Salvar registro
          </button>

        </div>

      </form>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/controle-processo-lancamento.js"></script>

</body>
</html>
