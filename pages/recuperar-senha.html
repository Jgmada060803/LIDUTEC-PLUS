<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recuperar senha | Metalsider</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body class="login-page" data-auth-page="recovery">
  <main class="login-container">
    <section class="login-brand"><div class="brand-badge">L+</div><h1>Metalsider</h1><p>Receba um link seguro para definir uma nova senha.</p></section>
    <section class="login-card">
      <div class="login-header"><h2>Recuperar senha</h2><p>Informe seu e-mail corporativo cadastrado.</p></div>
      <form id="account-form" class="auth-form">
        <div class="form-group"><label for="email">E-mail corporativo</label><input id="email" name="email" type="email" placeholder="nome@metalsider.com.br" autocomplete="email" required></div>
        <div id="account-message" class="form-message" hidden></div>
        <button class="button button-primary button-full">Enviar link de recuperação</button>
      </form>
      <nav class="auth-links"><a href="./login.html">Voltar ao login</a></nav>
      <div class="login-footer"><span>Metalsider · Acesso seguro</span></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth-contas.js"></script>
</body>
</html>
